        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1d242e; --line: #2a3340; --text: #e6edf3; --muted: #8b97a7;
  --accent: #ff7a1a; --accent2: #ffa15c; --ok: #22c55e; --warn: #eab308; --bad: #ef4444; --blue: #3b82f6;
  --r: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3 { margin: 0 0 .5em; font-weight: 650; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.05rem; color: var(--muted); font-weight: 600; }
a { color: var(--accent2); }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.hidden { display: none !important; }

/* ---------- barra in alto */
#topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.15rem; padding: 4px 6px; border-radius: 10px; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
#nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
#nav button { padding: 8px 14px; border-radius: 10px; color: var(--muted); white-space: nowrap; }
#nav button.active { background: var(--panel2); color: var(--text); }
.devices { display: flex; gap: 8px; }
.chip { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--panel2);
  border: 1px solid var(--line); font-size: .9rem; white-space: nowrap; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
.chip.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.chip.busy .dot { background: var(--warn); }
body.riding #nav, body.riding .brand span { display: none; }

main { flex: 1; overflow: auto; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
main.ride { padding: 8px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }

/* ---------- elementi comuni */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 18px; border-radius: 12px;
  background: var(--panel2); border: 1px solid var(--line); font-weight: 600; min-height: 46px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
.btn.danger { color: #fca5a5; border-color: #7f1d1d; }
.btn.big { padding: 16px 28px; font-size: 1.15rem; min-height: 60px; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.grid { display: grid; gap: 12px; }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--muted); font-size: .8rem; }
.banner { background: #3a2a12; border: 1px solid #7c5a1c; border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; }

/* home */
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-height: 140px;
  display: flex; flex-direction: column; gap: 6px; }
.tile .ico { font-size: 2rem; }
.tile b { font-size: 1.2rem; }
.tile:active { transform: scale(.98); }
.tile.main { background: linear-gradient(135deg, #3a1d07, #161b22 70%); border-color: #6b3510; }
.devbox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.devbox .card { display: flex; align-items: center; gap: 12px; }
.devbox .big-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--bad); flex: 0 0 auto; }
.devbox .on .big-dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }

/* liste */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.item.sel { border-color: var(--accent); }
.item canvas { width: 100%; height: 46px; display: block; margin-top: 8px; border-radius: 6px; background: #0b0e13; }
.split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 14px; align-items: start; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-size: 1.25rem; }
.stats span { color: var(--muted); font-size: .8rem; }
canvas.chart { width: 100%; height: 180px; display: block; background: #0b0e13; border-radius: 10px; }
.map { height: 320px; border-radius: 12px; overflow: hidden; background: #0b0e13; }

/* moduli */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* editor */
.blk { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: end; background: var(--panel2); border-radius: 12px; padding: 10px; }
.blk .fields { display: flex; gap: 8px; flex-wrap: wrap; }
.blk .fields label { width: 92px; }
.blk .fields input { width: 100%; }
.blk .tools { display: flex; gap: 4px; }
.blk .tools button { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }

/* modale e avvisi */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.modal-box .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
#toast div { background: #222b36; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }

/* ---------- schermata pedalata */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; flex: 0 0 auto; }
.m { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px 8px; display: flex; flex-direction: column; min-width: 0;
  container-type: inline-size; overflow: hidden; }
.m .k { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
/* la dimensione del numero segue la larghezza del riquadro, cosi' non esce mai */
.m .v { font-size: clamp(1.3rem, 24cqi, 2.8rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; white-space: nowrap; }
.m .v small { font-size: .45em; color: var(--muted); font-weight: 600; margin-left: 2px; }
.m .sub { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m.power .v { color: var(--accent2); }
.m.hi { border-color: var(--accent); }
.ride-body { flex: 1; min-height: 0; display: grid; gap: 8px; }
.ride-body.route { grid-template-columns: 1.5fr 1fr; grid-template-rows: 1fr 120px; }
.ride-body.route .map-wrap { grid-row: 1; grid-column: 1; }
.ride-body.route .side { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.ride-body.route .full-profile { grid-row: 2; grid-column: 1 / span 2; }
.ride-body.workout { grid-template-rows: auto 1fr; }
.ride-body.free { grid-template-rows: auto 1fr; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; min-height: 0; position: relative; }
.panel canvas { width: 100%; height: 100%; display: block; }
.map-wrap { border-radius: 14px; overflow: hidden; min-height: 0; }
.map-wrap .leaflet-container { height: 100%; background: #0b0e13; }
.gradebox { text-align: center; padding: 10px; container-type: inline-size; overflow: hidden; }
/* "-12.5%" deve stare nel riquadro: la dimensione segue la larghezza */
.gradebox .g { font-size: clamp(1.8rem, 21cqi, 4.5rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.step-info { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 6px 10px; }
.step-info .target { font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.step-info .left { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 8px; flex: 0 0 auto; align-items: center; }
.controls .btn { min-height: 58px; font-size: 1.1rem; }
.controls .adj { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.controls .adj button { width: 64px; height: 50px; border-radius: 10px; background: var(--panel2); font-size: 1.6rem; font-weight: 700; }
.controls .adj .val { min-width: 120px; text-align: center; font-weight: 700; font-size: 1.1rem; }
.controls .adj .val small { display: block; color: var(--muted); font-weight: 500; font-size: .75rem; }
.wait-banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700;
  background: rgba(14,17,22,.65); border-radius: 14px; z-index: 500; pointer-events: none; text-align: center; }
.seg { display: inline-flex; background: var(--panel2); border-radius: 12px; padding: 3px; border: 1px solid var(--line); }
.seg button { padding: 8px 14px; border-radius: 9px; color: var(--muted); font-weight: 600; }
.seg button.on { background: var(--accent); color: #111; }
.rider-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,.6); }

@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .devbox { grid-template-columns: 1fr; }
  .ride-body.route { grid-template-columns: 1fr; grid-template-rows: 1fr auto 100px; }
  .ride-body.route .side { grid-row: 2; grid-column: 1; flex-direction: row; }
  .ride-body.route .full-profile { grid-row: 3; grid-column: 1; }
  .chip .lbl { display: none; }
}
@media (orientation: portrait) and (min-width: 600px) {
  .ride-body.route { grid-template-columns: 1fr; grid-template-rows: 1fr 200px 120px; }
  .ride-body.route .side { grid-row: 2; grid-column: 1; flex-direction: row; }
  .ride-body.route .side > * { flex: 1; }
  .ride-body.route .full-profile { grid-row: 3; grid-column: 1; }
}

</style>
  <script>window.RULLO_CONFIG = { standalone: true, sw: true };</script>

'use strict';
const __m = {};
// ===== physics.js
__m.physics = (() => {
// Modello fisico della bici "virtuale": dalla potenza ai pedali ricava velocita' e distanza.
const G = 9.80665;

// Posizioni in sella: CdA di riferimento per un ciclista di 75 kg / 1,78 m
const POSITIONS = {
  alto: { label: 'Mani sul manubrio alto', cda: 0.44 },
  cappe: { label: 'Mani sulle leve (cappe)', cda: 0.38 },
  basso: { label: 'Presa bassa', cda: 0.32 },
  custom: { label: 'Valore personalizzato', cda: null },
};

const SURFACES = {
  liscio: { label: 'Asfalto liscio, gomme da corsa', crr: 0.004 },
  normale: { label: 'Asfalto normale', crr: 0.005 },
  rovinato: { label: 'Asfalto rovinato / gomme larghe', crr: 0.007 },
  sterrato: { label: 'Sterrato compatto', crr: 0.010 },
  custom: { label: 'Valore personalizzato', crr: null },
};

// La superficie frontale cresce con la corporatura (circa massa^(2/3))
function sizeFactor(weightKg) {
  return Math.pow(Math.max(40, weightKg) / 75, 2 / 3);
}

function profileCda(p) {
  if (p.position === 'custom' && p.cdaCustom) return +p.cdaCustom;
  const base = (POSITIONS[p.position] || POSITIONS.cappe).cda;
  return +(base * sizeFactor(p.weight || 75)).toFixed(3);
}

function profileCrr(p) {
  if (p.surface === 'custom' && p.crrCustom) return +p.crrCustom;
  return (SURFACES[p.surface] || SURFACES.normale).crr;
}

// Densita' dell'aria alla quota data (atmosfera standard, 20 gradi)
function airDensity(altM = 0, tempC = 20) {
  const p = 101325 * Math.pow(1 - 2.25577e-5 * Math.max(-400, Math.min(6000, altM)), 5.25588);
  return p / (287.05 * (tempC + 273.15));
}

class VirtualBike {
  constructor(params) {
    this.v = 0;      // m/s
    this.dist = 0;   // m
    this.setParams(params);
  }

  setParams({ mass, cda, crr, eta = 0.975 }) {
    this.mass = mass;
    this.mEff = mass + 1.5; // inerzia delle ruote
    this.cda = cda;
    this.crr = crr;
    this.eta = eta;
  }

  // power in W, grade in %, dt in s, rho densita' aria
  step(power, gradePct, dt, rho = 1.2) {
    const th = Math.atan((gradePct || 0) / 100);
    const sin = Math.sin(th), cos = Math.cos(th);
    const Pin = Math.max(0, power || 0) * this.eta;
    let remaining = dt;
    while (remaining > 1e-6) {
      const h = Math.min(0.1, remaining);
      remaining -= h;
      const v = this.v;
      const drive = Pin / Math.max(v, 1.0);
      const Fg = this.mass * G * sin;
      const Fr = this.mass * G * this.crr * cos;
      const Fa = 0.5 * rho * this.cda * v * v;
      let net = drive - Fg - Fa;
      if (v < 0.05) {
        // da fermo l'attrito volvente non spinge indietro
        if (net <= Fr) { this.v = 0; continue; }
      }
      net -= Fr;
      let nv = v + (net / this.mEff) * h;
      if (nv < 0) nv = 0;
      this.dist += (v + nv) / 2 * h;
      this.v = nv;
    }
    return this.v;
  }
}

// Velocita' di equilibrio a potenza costante (per stime e anteprime)
function steadySpeed(power, gradePct, { mass, cda, crr, eta = 0.975 }, rho = 1.2) {
  const th = Math.atan(gradePct / 100);
  const f = v => v * (mass * G * (Math.sin(th) + crr * Math.cos(th)) + 0.5 * rho * cda * v * v) - power * eta;
  let lo = 0, hi = 40;
  if (f(hi) < 0) return hi;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) hi = mid; else lo = mid;
  }
  return (lo + hi) / 2;
}

return { G, POSITIONS, SURFACES, sizeFactor, profileCda, profileCrr, airDensity, VirtualBike, steadySpeed };

// ===== ble.js
__m.ble = (() => {
// Collegamento Bluetooth (Web Bluetooth) al rullo e alla fascia cardio.
// Rullo: protocollo standard FTMS (0x1826) oppure protocollo Wahoo (caratteristica
// a026e005 dentro il servizio Cycling Power 0x1818). Lettura dati da FTMS
// "Indoor Bike Data" oppure da "Cycling Power Measurement".

const FTMS = 0x1826, FTMS_DATA = 0x2ad2, FTMS_CP = 0x2ad9, FTMS_STATUS = 0x2ada;
const CPS = 0x1818, CPS_MEAS = 0x2a63;
const WAHOO_CTRL = 'a026e005-0a7d-4ab3-97fa-f1500f9feb8b';
const WAHOO_SVC2 = 'a026ee0b-0a7d-4ab3-97fa-f1500f9feb8b';
const HR_SVC = 0x180d, HR_MEAS = 0x2a37;

const bluetoothAvailable = () => !!(navigator.bluetooth && navigator.bluetooth.requestDevice);

class Emitter {
  constructor() { this._h = {}; }
  on(ev, fn) { (this._h[ev] ||= []).push(fn); return () => this.off(ev, fn); }
  off(ev, fn) { this._h[ev] = (this._h[ev] || []).filter(f => f !== fn); }
  emit(ev, data) { (this._h[ev] || []).forEach(f => { try { f(data); } catch (e) { console.error(e); } }); }
}

const u16 = v => [v & 0xff, (v >> 8) & 0xff];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------------ Rullo
class Trainer extends Emitter {
  constructor() {
    super();
    this.device = null;
    this.connected = false;
    this.protocol = null;   // 'ftms' | 'wahoo'
    this.preferred = 'auto';
    this.data = { power: 0, cadence: null, speed: null, ts: 0 };
    this.mode = null;       // 'erg' | 'sim'
    this.last = {};         // ultimi comandi per riapplicarli dopo una riconnessione
    this._q = Promise.resolve();
    this._crank = null;
    this._manualClose = false;
  }

  get name() { return this.device ? (this.device.name || 'Rullo') : ''; }

  async connect(preferred = 'auto') {
    this.preferred = preferred;
    this.device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [FTMS] }, { services: [CPS] }, { namePrefix: 'KICKR' }],
      optionalServices: [FTMS, CPS, WAHOO_SVC2, 0x180a],
    });
    this.device.addEventListener('gattserverdisconnected', () => this._onDisconnect());
    this._manualClose = false;
    await this._setup();
  }

  async _setup() {
    this.emit('status', 'Collegamento…');
    const server = await this.device.gatt.connect();
    let ftms = null, cps = null, wahoo = null;
    try { ftms = await server.getPrimaryService(FTMS); } catch { /* assente */ }
    try { cps = await server.getPrimaryService(CPS); } catch { /* assente */ }
    if (cps) { try { wahoo = await cps.getCharacteristic(WAHOO_CTRL); } catch { /* assente */ } }

    let proto = this.preferred;
    if (proto === 'wahoo' && !wahoo) proto = 'auto';
    if (proto === 'ftms' && !ftms) proto = 'auto';
    if (proto === 'auto') proto = wahoo ? 'wahoo' : (ftms ? 'ftms' : null);
    if (!proto) throw new Error('Il dispositivo non espone ne\' FTMS ne\' il controllo Wahoo');
    this.protocol = proto;
    this.mode = null;
    this._crank = null;

    if (proto === 'ftms') {
      const data = await ftms.getCharacteristic(FTMS_DATA);
      data.addEventListener('characteristicvaluechanged', e => this._parseFtms(e.target.value));
      await data.startNotifications();
      this.cp = await ftms.getCharacteristic(FTMS_CP);
      this.cp.addEventListener('characteristicvaluechanged', e => this._ftmsResponse(e.target.value));
      await this.cp.startNotifications();
      try {
        const st = await ftms.getCharacteristic(FTMS_STATUS);
        await st.startNotifications();

      await this._write(this.cp, [0x00]);        // richiesta controllo

      await meas.startNotifications();

      this.cp.addEventListener('characteristicvaluechanged', e => this._wahooResponse(e.target.value));
      await this.cp.startNotifications();
      await this._write(this.cp, [0x20, 0xee, 0xfc]); // sblocco
    }
    this.connected = true;
    this.emit('status', `Collegato (${proto === 'ftms' ? 'FTMS' : 'Wahoo'})`);
    this.emit('connected', this);
    // riapplica l'ultimo comando (dopo una riconnessione)
    if (this.last.erg != null && this.lastMode === 'erg') await this.setErg(this.last.erg);
    else if (this.last.sim) await this.setSim(this.last.sim);

  _onDisconnect() {

    this.connected = false;
    this.emit('status', 'Disconnesso');
    this.emit('disconnected', this);

  async _reconnect() {

      this.emit('status', `Riconnessione (${i})…`);
      try { await this._setup(); return; } catch (e) { console.warn('riconnessione', e); }
      await new Promise(r => setTimeout(r, 2000));
    }
    this.emit('status', 'Disconnesso');
  }

  disconnect() {
    this._manualClose = true;
    if (this.device && this.device.gatt.connected) this.device.gatt.disconnect();

  // scritture in fila: Web Bluetooth non accetta due operazioni GATT insieme
  _write(char, bytes) {

      .catch(e => { console.warn('scrittura BLE', e); });

  }

  _ftmsResponse(dv) {
    if (dv.getUint8(0) === 0x80 && dv.byteLength >= 3) {
      const op = dv.getUint8(1), res = dv.getUint8(2);
      if (res !== 1) console.warn(`FTMS: comando 0x${op.toString(16)} risposta ${res}`);
    }
  }
  _wahooResponse(dv) {
    if (dv.byteLength >= 2 && dv.getUint8(0) !== 0x01) console.warn('Wahoo risposta', dv.getUint8(0), dv.getUint8(1));
  }

  // ---- comandi
  async setErg(watts) {
    watts = Math.round(clamp(watts, 0, 2000));
    this.last.erg = watts;
    this.lastMode = 'erg';
    if (!this.connected) return;
    if (this.protocol === 'ftms') await this._write(this.cp, [0x05, ...u16(watts)]);
    else await this._write(this.cp, [0x42, ...u16(watts)]);
    this.mode = 'erg';
  }

  // sim: { grade %, crr, cw (kg/m = rho*CdA), weight kg, wind m/s }
  async setSim(sim) {
    const prev = this.last.sim || {};
    this.last.sim = { ...prev, ...sim };
    this.lastMode = 'sim';
    if (!this.connected) return;
    const s = this.last.sim;
    const grade = clamp(s.grade || 0, -20, 20);
    if (this.protocol === 'ftms') {
      const wind = Math.round(clamp(s.wind || 0, -32, 32) * 1000);
      const g = Math.round(grade * 100);
      await this._write(this.cp, [0x11, ...u16(wind & 0xffff), ...u16(g & 0xffff),
        clamp(Math.round((s.crr ?? 0.004) * 10000), 0, 255), clamp(Math.round((s.cw ?? 0.51) * 100), 0, 255)]);
    } else {
      const needInit = this.mode !== 'sim' || prev.weight !== s.weight || prev.crr !== s.crr || prev.cw !== s.cw;
      if (needInit) {
        await this._write(this.cp, [0x43, ...u16(Math.round((s.weight ?? 85) * 100)),
          ...u16(Math.round((s.crr ?? 0.004) * 10000)), ...u16(Math.round((s.cw ?? 0.51) * 1000))]);
      }
      const v = clamp(Math.round((grade / 100 + 1) * 32768), 0, 65535);
      await this._write(this.cp, [0x46, ...u16(v)]);

  _parseFtms(dv) {
    let o = 0;
    const flags = dv.getUint16(o, true); o += 2;
    const d = { ts: performance.now() };
    if (!(flags & 0x0001)) { d.speed = dv.getUint16(o, true) / 100; o += 2; }
    if (flags & 0x0002) o += 2;
    if (flags & 0x0004) { d.cadence = dv.getUint16(o, true) / 2; o += 2; }
    if (flags & 0x0008) o += 2;
    if (flags & 0x0010) o += 3;
    if (flags & 0x0020) o += 2;
    if (flags & 0x0040) { d.power = dv.getInt16(o, true); o += 2; }
    if (flags & 0x0080) o += 2;
    if (flags & 0x0100) o += 5;
    if (flags & 0x0200) { d.hr = dv.getUint8(o); o += 1; }
    Object.assign(this.data, d);
    this.emit('data', this.data);
  }

  _parseCps(dv) {
    let o = 0;
    const flags = dv.getUint16(o, true); o += 2;
    const d = { ts: performance.now(), power: dv.getInt16(o, true) }; o += 2;
    if (flags & 0x0001) o += 1;          // bilanciamento
    if (flags & 0x0004) o += 2;          // coppia accumulata
    if (flags & 0x0010) o += 6;          // giri ruota
    if (flags & 0x0020) {                // giri pedivella -> cadenza

      const now = performance.now();
      const c = this._crank;

let modalClose = null;
function modal(html, buttons = [{ label: 'OK', value: true, cls: 'primary' }], onOpen) {
  return new Promise(resolve => {
    const m = $('#modal'), box = $('.modal-box', m);
    box.innerHTML = `${html}<div class="actions">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`;
    m.hidden = false;
    if (modalClose) modalClose(null);
    const close = v => { modalClose = null; m.hidden = true; box.innerHTML = ''; resolve(v); };
    modalClose = close;
    $$('.actions button', box).forEach(btn => btn.onclick = () => {
      const b = buttons[+btn.dataset.i];
      const v = typeof b.value === 'function' ? b.value(box) : b.value;
      if (v === undefined && typeof b.value === 'function') return; // validazione fallita
      close(v);
    });
    m.onclick = e => { if (e.target === m && buttons.some(b => b.value === false || b.value === null)) close(null); };
    if (onOpen) onOpen(box, close);
  });
}
const confirmBox = (msg, ok = 'Conferma', cls = 'primary') => modal(`<p>${msg}</p>`, [{ label: 'Annulla', value: false }, { label: ok, value: true, cls }]);

function pickFile(accept, multiple = false) {
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.multiple = multiple;
    inp.onchange = () => resolve([...inp.files]);
    inp.click();
  });
}

function download(name, data, type = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// durata "mm:ss" o "h:mm:ss" o minuti
function parseDur(s) {
  s = String(s).trim().replace(',', '.');
  if (!s) return 0;
  if (s.includes(':')) {
    const p = s.split(':').map(Number);
    return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
  }
  return Math.round(parseFloat(s) * 60);
}

// ====================================================================== dispositivi
function updateChips() {
  const t = S.trainer, h = S.hr;
  const ct = $('#chipTrainer'), ch = $('#chipHr');
  ct.className = 'chip ' + (t?.connected ? 'on' : t?._busy ? 'busy' : 'off');
  ch.className = 'chip ' + (h?.connected ? 'on' : h?._busy ? 'busy' : 'off');
  $('.lbl', ct).textContent = t?.connected ? (t.name || 'Rullo') : 'Rullo';
  $('.lbl', ch).textContent = h?.connected ? (h.hr ? `${h.hr} bpm` : (h.name || 'Cardio')) : 'Cardio';
  $$('[data-dev]').forEach(el => {
    const d = el.dataset.dev === 'trainer' ? t : h;
    el.classList.toggle('on', !!d?.connected);
    const st = $('.st', el);
    if (st) st.textContent = d?.connected ? `${d.name} – ${d.statusText || 'collegato'}` : (d?.statusText && d.statusText !== 'Disconnesso' ? d.statusText : 'Non collegato');
  });
}

function wireDevice(dev) {
  dev.on('status', s => { dev.statusText = s; updateChips(); });
  dev.on('connected', updateChips);
  dev.on('disconnected', () => { updateChips(); toast(`${dev.name || 'Dispositivo'} disconnesso`); });
  if (dev instanceof HeartRate || dev instanceof SimHeartRate) dev.on('data', () => updateChips());
}

async function connectTrainer(demo = false) {
  if (S.trainer?.connected) S.trainer.disconnect();
  const t = demo ? new SimTrainer() : new Trainer();
  wireDevice(t);
  S.trainer = t; t._busy = true; updateChips();
  try {
    await t.connect(S.profile?.protocol || 'auto');
    toast(`${t.name} collegato${t.protocol && t.protocol !== 'demo' ? ` (protocollo ${t.protocol.toUpperCase()})` : ''}`);
  } catch (e) {
    if (e.name !== 'NotFoundError') toast('Rullo: ' + e.message, 5000);
    S.trainer = null;
  } finally { t._busy = false; updateChips(); }
}

async function connectHr(demo = false) {
  if (S.hr?.connected) S.hr.disconnect();
  const h = demo ? new SimHeartRate(S.trainer) : new HeartRate();
  wireDevice(h);
  S.hr = h; h._busy = true; updateChips();
  try { await h.connect(); toast(`${h.name} collegato`); }
  catch (e) { if (e.name !== 'NotFoundError') toast('Cardio: ' + e.message, 5000); S.hr = null; }
  finally { h._busy = false; updateChips(); }
}

async function deviceDialog(kind) {
  const isT = kind === 'trainer';
  const dev = isT ? S.trainer : S.hr;
  const bt = bluetoothAvailable();
  const btns = [{ label: 'Chiudi', value: null }];
  if (dev?.connected) btns.push({ label: 'Scollega', value: 'off', cls: 'danger' });
  btns.push({ label: 'Demo (simulato)', value: 'demo' });
  if (bt) btns.push({ label: dev?.connected ? 'Cambia' : 'Cerca e collega', value: 'scan', cls: 'primary' });
  const info = isT
    ? `<p>Il rullo deve essere acceso e <b>non collegato ad altre app</b> (chiudi Rouvy e l'app Wahoo, anche sul telefono).</p>`
    : `<p>Sull'orologio Garmin avvia <b>Trasmetti FC</b> (o una fascia Bluetooth), poi cercala qui.</p>`;
  const warn = bt ? '' : `<p class="banner">Questo browser non supporta il Bluetooth web. Usa <b>Chrome su Android</b> o su PC, con l'app aperta in HTTPS.</p>`;
  const r = await modal(`<h2>${isT ? 'Rullo' : 'Fascia cardio'}</h2>${warn}${info}
    <p class="muted small">Stato: ${dev?.connected ? esc(dev.name) + ' collegato' : 'non collegato'}</p>`, btns);
  if (r === 'off') dev.disconnect();
  if (r === 'scan') isT ? connectTrainer() : connectHr();
  if (r === 'demo') isT ? connectTrainer(true) : connectHr(true);
}

// ====================================================================== navigazione
const SCREENS = { home: renderHome, workouts: renderWorkouts, routes: renderRoutes, history: renderHistory, profile: renderProfile, ride: renderRide };
let currentScreen = null;

function go(name, push = true) {
  if (push) location.hash = name;
  else route();
}

function route() {
  const name = (location.hash.slice(1) || 'home').split('/')[0];
  if (S.session && name !== 'ride') {
    // durante la pedalata non si esce dalla schermata
    history.replaceState(null, '', '#ride');
    if (currentScreen !== 'ride') renderRide();
    toast('Premi "Fine" per terminare la pedalata');
    return;
  }
  if (name === 'ride' && !S.session) { history.replaceState(null, '', '#home'); return renderScreen('home'); }
  renderScreen(SCREENS[name] ? name : 'home');
}

function renderScreen(name) {
  if (modalClose && name !== 'home') modalClose(null); // cambiando schermata si chiude la finestra aperta
  currentScreen = name;
  main.className = name === 'ride' ? 'ride' : '';
  document.body.classList.toggle('riding', name === 'ride');
  $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.go === name));
  if (window._mapCleanup) { window._mapCleanup(); window._mapCleanup = null; }
  main.innerHTML = '';
  SCREENS[name]();
}

        <h3 style="margin:6px 0 0">${title}</h3>
        ${arr.length ? arr.map(w => { const st = wStats(w.blocks); return `
          <button class="item ${w.id === sel?.id ? 'sel' : ''}" data-id="${esc(w.id)}">
            <div class="row"><b>${esc(w.name)}</b><div class="spacer"></div><span class="tag">${fmtDur(st.duration)}</span><span class="tag">TSS ${st.tss}</span></div>

function blockText(b, ftp) {
  const w = p => `${p}% (${Math.round(p * ftp / 100)} W)`;
  if (b.type === 'steady') return `${fmtDur(b.dur)} a ${w(b.pct)}`;
  if (b.type === 'ramp') return `${fmtDur(b.dur)} da ${w(b.from)} a ${w(b.to)}`;
  if (b.type === 'intervals') return `${b.reps} × (${fmtDur(b.onDur)} a ${w(b.onPct)} + ${fmtDur(b.offDur)} a ${w(b.offPct)})`;
  return `${fmtDur(b.dur)} libera${b.text ? ' – ' + esc(b.text) : ''}`;
}

function showWorkoutDetail(w) {
  const box = $('#wDetail');
  const st = wStats(w.blocks);
  const ftp = S.profile.ftp;
  const user = w.source === 'user';
  box.innerHTML = `
    <div class="row"><h2 style="margin:0">${esc(w.name)}</h2><div class="spacer"></div>${w.category ? `<span class="tag">${esc(w.category)}</span>` : ''}</div>
    <p class="muted">${esc(w.description || '')}</p>
    <div class="stats"><div><b>${fmtDur(st.duration)}</b><span>durata</span></div><div><b>${st.tss}</b><span>TSS stimato</span></div>
      <div><b>${st.IF.toFixed(2)}</b><span>intensità (IF)</span></div><div><b>${Math.round(st.IF * ftp)} W</b><span>potenza normalizzata</span></div></div>
    <canvas class="chart" id="wChart"></canvas>
    <ol class="small" style="padding-left:20px;max-height:220px;overflow:auto">${w.blocks.map(b => `<li>${blockText(b, ftp)}</li>`).join('')}</ol>
    <div class="row" style="margin-top:12px">
      <button class="btn primary big" id="wStart">▶ Inizia</button>
      <button class="btn" id="wEdit">${user ? 'Modifica' : 'Copia e modifica'}</button>
      <button class="btn" id="wExport">Esporta .zwo</button>
      ${user ? '<button class="btn danger" id="wDel">Elimina</button>' : ''}
    </div>`;
  drawWorkout($('#wChart'), w.blocks);
  $('#wStart').onclick = () => startSession({ kind: 'workout', workout: w });
  $('#wEdit').onclick = () => editWorkout(user ? structuredClone(w) : { ...structuredClone(w), id: undefined, source: 'user', name: w.name + ' (copia)' });

    if (!await confirmBox(`Eliminare "${esc(w.name)}"?`, 'Elimina', 'danger')) return;
    await api.deleteWorkout(w.id); toast('Eliminato'); renderWorkouts();
  };
}

async function importWorkouts() {
  const files = await pickFile('.zwo,.erg,.mrc,.xml,.txt', true);
  let ok = 0, last;
  for (const f of files) {
    try {
      const w = importWorkoutFile(f.name, await f.text(), S.profile.ftp);
      last = await api.saveWorkout(w); ok++;
    } catch (e) { toast(`${f.name}: ${e.message}`, 5000); }
  }
  if (ok) { toast(`${ok} allenamenti importati`); renderWorkouts(last.id); }
}

function editWorkout(w) {
  const ftp = S.profile.ftp;
  const types = { steady: 'Costante', ramp: 'Rampa', intervals: 'Ripetute', free: 'Libera' };
  const defaults = {
    steady: { type: 'steady', dur: 300, pct: 75 }, ramp: { type: 'ramp', dur: 300, from: 50, to: 80 },
    intervals: { type: 'intervals', reps: 4, onDur: 120, onPct: 100, offDur: 120, offPct: 55 }, free: { type: 'free', dur: 300 },
  };
  main.innerHTML = `
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">Modifica allenamento</h2><div class="spacer"></div>
      <button class="btn" id="eCancel">Annulla</button><button class="btn primary" id="eSave">Salva</button></div>
    <div class="card" style="margin-bottom:12px">
      <div class="form-grid"><label class="f">Nome<input id="eName"></label><label class="f" style="grid-column:span 2">Descrizione<input id="eDesc"></label></div>
      <div class="stats" id="eStats"></div>
      <canvas class="chart" id="eChart"></canvas>
      <p class="muted small">Durate in minuti (es. 5 o 4:30). Intensità in % di FTP (${ftp} W): accanto vedi i watt.</p>
    </div>
    <div class="list" id="eBlocks"></div>
    <div class="row" style="margin-top:12px">${Object.entries(types).map(([k, v]) => `<button class="btn" data-add="${k}">+ ${v}</button>`).join('')}</div>`;
  $('#eName').value = w.name || '';
  $('#eDesc').value = w.description || '';
  const pctField = (key, label, b) => `<label class="f">${label}<input type="number" inputmode="numeric" data-k="${key}" value="${b[key]}"><span class="small">${Math.round(b[key] * ftp / 100)} W</span></label>`;
  const durField = (key, label, b) => `<label class="f">${label}<input data-k="${key}" data-dur="1" inputmode="decimal" value="${fmtDur(b[key])}"></label>`;
  const redraw = () => {
    drawWorkout($('#eChart'), w.blocks);
    const st = wStats(w.blocks);
    $('#eStats').innerHTML = `<div><b>${fmtDur(st.duration)}</b><span>durata</span></div><div><b>${st.tss}</b><span>TSS</span></div><div><b>${st.IF.toFixed(2)}</b><span>IF</span></div>`;
  };
  const renderBlocks = () => {
    $('#eBlocks').innerHTML = w.blocks.map((b, i) => `
      <div class="blk" data-i="${i}">
        <label class="f">Tipo<select data-type>${Object.entries(types).map(([k, v]) => `<option value="${k}" ${k === b.type ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <div class="fields">${
          b.type === 'steady' ? durField('dur', 'Durata', b) + pctField('pct', '% FTP', b)
          : b.type === 'ramp' ? durField('dur', 'Durata', b) + pctField('from', 'Da %', b) + pctField('to', 'A %', b)
          : b.type === 'intervals' ? `<label class="f">Ripetizioni<input type="number" data-k="reps" value="${b.reps}"></label>` + durField('onDur', 'Lavoro', b) + pctField('onPct', 'Lavoro %', b) + durField('offDur', 'Recupero', b) + pctField('offPct', 'Recupero %', b)
          : durField('dur', 'Durata', b)}</div>
        <div class="tools"><button data-act="up" title="Su">↑</button><button data-act="down" title="Giù">↓</button><button data-act="dup" title="Duplica">⧉</button><button data-act="del" title="Elimina">✕</button></div>
      </div>`).join('');
    $$('#eBlocks .blk').forEach(el => {
      const i = +el.dataset.i;
      $('[data-type]', el).onchange = e => { w.blocks[i] = { ...defaults[e.target.value] }; renderBlocks(); };
      $$('input[data-k]', el).forEach(inp => inp.onchange = () => {
        const k = inp.dataset.k;
        w.blocks[i][k] = inp.dataset.dur ? parseDur(inp.value) : Math.max(0, +inp.value || 0);
        renderBlocks();
      });
      $$('[data-act]', el).forEach(btn => btn.onclick = () => {
        const a = btn.dataset.act, bl = w.blocks;
        if (a === 'del') bl.splice(i, 1);
        if (a === 'dup') bl.splice(i + 1, 0, structuredClone(bl[i]));
        if (a === 'up' && i > 0) [bl[i - 1], bl[i]] = [bl[i], bl[i - 1]];
        if (a === 'down' && i < bl.length - 1) [bl[i + 1], bl[i]] = [bl[i], bl[i + 1]];
        renderBlocks();
      });
    });
    redraw();
  };
  $$('[data-add]').forEach(b => b.onclick = () => { w.blocks.push(structuredClone(defaults[b.dataset.add])); renderBlocks(); });
  $('#eCancel').onclick = () => renderWorkouts(w.id);
  $('#eSave').onclick = async () => {
    w.name = $('#eName').value.trim() || 'Allenamento';
    w.description = $('#eDesc').value.trim();
    if (!w.blocks.length) return toast('Aggiungi almeno un blocco');
    try { const saved = await api.saveWorkout(w); toast('Salvato'); renderWorkouts(saved.id); }
    catch (e) { toast(e.message, 5000); }
  };
  renderBlocks();
}

async function loadRoute(meta) {
  if (!S.routeCache[meta.id]) S.routeCache[meta.id] = routeFromGpx(await api.routeGpx(meta.id));
  return S.routeCache[meta.id];
}

function estimateTime(route, profile, watts) {
  const params = { mass: +profile.weight + +profile.bikeWeight, cda: profileCda(profile), crr: profileCrr(profile) };
  let t = 0;
  for (let d = 0; d < route.length; d += 100) {
    const seg = Math.min(100, route.length - d);
    const a = route.at(d), b = route.at(d + seg);
    const g = (b.ele - a.ele) / seg * 100;
    t += seg / Math.max(1, steadySpeed(watts, g, params, airDensity(a.ele)));
  }
  return t;
}

async function uploadGpx() {
  const files = await pickFile('.gpx,application/gpx+xml', true);
  let last;
  for (const f of files) {
    try {
      const text = await f.text();
      const r = routeFromGpx(text);
      if (!r.hasEle) toast(`${f.name}: il file non ha le quote, il percorso sarà piatto`, 6000);
      const meta = await api.saveRoute({ name: r.name || f.name.replace(/\.gpx$/i, ''), gpx: text, ...r.summary() });
      S.routeCache[meta.id] = r; last = meta;
    } catch (e) { toast(`${f.name}: ${e.message}`, 6000); }
  }
  if (last) { toast('Percorso caricato'); renderRoutes(last.id); }
}
