// Sfondi della mappa. OpenStreetMap blocca le pagine aperte da file (non mandano il "Referer"),
// quindi aprendo Rullo.html dal disco si usa Esri; se un server da' errori si passa al successivo.
const TILES = {
  osm: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }],
  esri: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap' }],
  cyclosm: ['https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',
    { maxZoom: 19, subdomains: 'abc', attribution: '© CyclOSM, © OpenStreetMap' }],
};
function addTiles(map) {
  const order = location.protocol === 'file:' ? ['esri', 'cyclosm'] : ['osm', 'esri'];
  let i = 0, errors = 0, layer;
  const use = () => {
    layer = L.tileLayer(...TILES[order[i]]).addTo(map);
    layer.on('tileerror', () => {
      if (++errors > 4 && i < order.length - 1) { map.removeLayer(layer); i++; errors = 0; use(); }
    });
  };
  use();
}

function makeMap(el, route, { interactive = true } = {}) {
  if (!window.L) { el.innerHTML = '<p class="muted" style="padding:12px">Mappa non disponibile (serve la connessione a Internet)</p>'; return null; }
  const map = L.map(el, { zoomControl: interactive, attributionControl: true, dragging: interactive, scrollWheelZoom: interactive });
  addTiles(map);
  const line = L.polyline(route.latlngs(), { color: '#ff7a1a', weight: 4 }).addTo(map);
  L.circleMarker([route.lat[0], route.lon[0]], { radius: 6, color: '#fff', fillColor: '#22c55e', fillOpacity: 1 }).addTo(map);
  L.circleMarker([route.lat[route.n - 1], route.lon[route.n - 1]], { radius: 6, color: '#fff', fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [20, 20] });
  return map;
}

// ====================================================================== PEDALATA
async function startSession(opts) {
  if (!S.trainer?.connected) {
    const r = await modal(`<h2>Rullo non collegato</h2><p>Collega il rullo per iniziare. Puoi anche provare l'app con il rullo simulato.</p>`,
      [{ label: 'Annulla', value: null }, { label: 'Demo (simulato)', value: 'demo' }, ...(bluetoothAvailable() ? [{ label: 'Collega rullo', value: 'scan', cls: 'primary' }] : [])]);
    if (!r) return;
    await connectTrainer(r === 'demo');
    if (!S.trainer?.connected) return;
    if (r === 'demo' && !S.hr?.connected) await connectHr(true);
  }
  const profile = { ...S.profile };
  if (opts.difficulty != null) profile.difficulty = opts.difficulty;
  const s = new RideSession({ ...opts, profile, trainer: S.trainer, hr: S.hr });
  S.session = s;
  s.on('autosave', () => savePending(s.activity()));
  s.on('finished', () => toast(opts.kind === 'route' ? '🏁 Arrivato! Premi "Fine" per salvare' : '✅ Allenamento completato! Puoi continuare in libera o premere "Fine"', 6000));
  s.on('step', cs => { if (cs && S.session === s) { const nx = cs.s; toast(nx.kind === 'free' ? 'Tratto libero' : `${nx.text ? nx.text + ': ' : ''}${Math.round(pctAt(nx, 0) * s.ftp / 100 * s.intensity / 100)} W per ${fmtDur(nx.dur)}`); beep(); } });
  s.start();
  requestWakeLock();
  go('ride');
}

let audioCtx;
function beep() {
  try {
    audioCtx ||= new AudioContext();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  } catch { /* niente audio */ }
}

async function requestWakeLock() {
  try { if ('wakeLock' in navigator) S.wakeLock = await navigator.wakeLock.request('screen'); } catch { /* non disponibile */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.session) requestWakeLock(); });

function renderRide() {
  const s = S.session;
  const kind = s.workout && !s.routeMeta ? 'workout' : s.routeMeta ? 'route' : 'free';
  main.innerHTML = `
    <div class="metrics">
      <div class="m power"><span class="k">Potenza</span><span class="v" id="mP">0<small>W</small></span><span class="sub" id="mPs"></span></div>
      <div class="m"><span class="k">Cadenza</span><span class="v" id="mC">–<small>rpm</small></span></div>
      <div class="m"><span class="k">Cardio</span><span class="v" id="mH">–<small>bpm</small></span><span class="sub" id="mHs"></span></div>
      <div class="m"><span class="k">Velocità</span><span class="v" id="mV">0<small>km/h</small></span></div>
      <div class="m"><span class="k">Distanza</span><span class="v" id="mD">0<small>km</small></span><span class="sub" id="mDs"></span></div>
      <div class="m"><span class="k">Tempo</span><span class="v" id="mT">0:00</span><span class="sub" id="mTs"></span></div>
    </div>
    <div class="ride-body ${kind}" id="rb"></div>
    <div class="controls">
      <button class="btn" id="cPause">⏸ Pausa</button>
      <div class="adj"><button id="cMinus">−</button><div class="val" id="cVal"></div><button id="cPlus">+</button></div>
      ${kind === 'workout' ? '<button class="btn" id="cSkip">Salta ⏭</button>' : ''}
      ${kind === 'free' ? `<div class="seg" id="cMode"><button data-m="sim">Pendenza</button><button data-m="erg">Watt</button></div>` : ''}
      <button class="btn" id="cLap">Giro</button>
      <div class="spacer"></div>
      <button class="btn danger" id="cEnd">■ Fine</button>
    </div>`;
  const rb = $('#rb');
  let map, marker, done;
  if (kind === 'workout') {
    rb.innerHTML = `<div class="panel step-info" id="stepInfo"></div><div class="panel"><canvas id="wkC"></canvas><div class="wait-banner" id="wait">Inizia a pedalare per partire</div></div>`;
  } else if (kind === 'route') {
    rb.innerHTML = `
      <div class="map-wrap" id="rideMap"></div>
      <div class="side">
        <div class="panel gradebox"><div class="muted small">PENDENZA</div><div class="g" id="gNow">0%</div><div class="muted small" id="gNext"></div></div>
        <div class="panel" style="flex:1;min-height:90px"><canvas id="nearProf"></canvas></div>
      </div>
      <div class="panel full-profile"><canvas id="fullProf"></canvas><div class="wait-banner" id="wait">Inizia a pedalare per partire</div></div>`;
    map = makeMap($('#rideMap'), s.route);
    if (map) {
      const icon = L.divIcon({ className: '', html: '<div class="rider-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
      marker = L.marker([s.route.lat[0], s.route.lon[0]], { icon }).addTo(map);
      done = L.polyline([], { color: '#ffd8b8', weight: 6, opacity: .9 }).addTo(map);
      map.setView([s.route.lat[0], s.route.lon[0]], 15);
    }
  } else {
    rb.innerHTML = `<div class="panel step-info" id="freeInfo"></div><div class="panel"><canvas id="freeC"></canvas><div class="wait-banner" id="wait">Inizia a pedalare per partire</div></div>`;
  }
  // se il tablet ruota, la mappa deve ricalcolare le sue dimensioni
  const onResize = () => { if (map) setTimeout(() => map.invalidateSize(), 200); };
  window.addEventListener('resize', onResize);
  window._mapCleanup = () => { window.removeEventListener('resize', onResize); if (map) map.remove(); };

  $('#cPause').onclick = () => { s.togglePause(); };
  $('#cMinus').onclick = () => s.adjust(-1);
  $('#cPlus').onclick = () => s.adjust(+1);
  $('#cLap').onclick = () => { s.lap(); toast('Nuovo giro'); };
  $('#cEnd').onclick = endSession;
  if ($('#cSkip')) $('#cSkip').onclick = () => s.skipStep();
  if ($('#cMode')) $$('#cMode button').forEach(b => b.onclick = () => { s.setFreeMode(b.dataset.m); update(); });

  let lastDraw = 0, follow = true, lastPathLen = 0;
  if (map) map.on('dragstart', () => { follow = false; setTimeout(() => { follow = true; }, 15000); });

  function update() {
    if (S.session !== s) return;
    const inp = s.inputs || { power: 0 };
    const st = s.liveStats();
    $('#mP').innerHTML = `${s.power3s()}<small>W</small>`;
    $('#mPs').textContent = st.avgP != null ? `media ${n0(st.avgP)} · NP ${n0(st.np)}` : '';
    $('#mC').innerHTML = `${inp.cadence != null ? inp.cadence : '–'}<small>rpm</small>`;
    $('#mH').innerHTML = `${inp.hr || '–'}<small>bpm</small>`;
    $('#mHs').textContent = st.avgHr ? `media ${n0(st.avgHr)}` : '';
    $('#mV').innerHTML = `${(s.speed * 3.6).toFixed(1)}<small>km/h</small>`;
    $('#mD').innerHTML = `${km(s.dist)}<small>km</small>`;
    $('#mT').textContent = fmtDur(st.time);
    $('#mTs').textContent = `${n0(st.kj)} kJ · TSS ${n0(st.tss)}`;
    $('#cPause').textContent = s.state === 'paused' ? '▶ Riprendi' : '⏸ Pausa';
    const wait = $('#wait');
    if (wait) {
      wait.classList.toggle('hidden', s.state === 'running');
      wait.textContent = s.state === 'paused' ? (s.manualPause ? 'In pausa' : 'Pausa automatica: riprendi a pedalare') : 'Inizia a pedalare per partire';
    }
    // controllo +/-
    let val;
    if (s.kind === 'workout') val = `${s.intensity}%<small>intensità</small>`;
    else if (s.kind === 'route') val = `${s.difficulty}%<small>difficoltà</small>`;
    else if (s.freeMode === 'erg') val = `${s.freeErg} W<small>obiettivo</small>`;
    else val = `${s.freeGrade.toFixed(1)}%<small>pendenza</small>`;
    $('#cVal').innerHTML = val;
    if ($('#cMode')) $$('#cMode button').forEach(b => b.classList.toggle('on', b.dataset.m === s.freeMode));

    const now = performance.now();
    const heavy = now - lastDraw > 900;
    if (heavy) lastDraw = now;

    if (kind === 'workout') {
      const cs = s.kind === 'workout' ? s.currentStep() : null;
      const tgt = s.targetPower();
      const next = cs ? s.steps[cs.i + 1] : null;
      $('#stepInfo').innerHTML = cs ? `
        <div><div class="muted small">OBIETTIVO</div><div class="target" style="color:${cs.s.kind === 'free' ? '#94a3b8' : zoneOf(pctAt(cs.s, cs.t)).color}">${tgt != null ? tgt + ' W' : 'Libera'}</div></div>
        <div><div class="muted small">FINE PASSO</div><div class="left">${fmtDur(cs.s.dur - cs.t)}</div></div>
        <div><div class="muted small">RIMANENTE</div><div class="left">${fmtDur(s.duration - s.elapsed)}</div></div>
        <div class="muted">${cs.s.text ? esc(cs.s.text) + '<br>' : ''}${next ? `Poi: ${next.kind === 'free' ? 'libera' : Math.round(pctAt(next, 0) * s.ftp / 100 * s.intensity / 100) + ' W'} per ${fmtDur(next.dur)}` : 'Ultimo passo'}</div>`
        : `<div class="target">Completato ✅</div><div class="muted">Continui in pedalata libera (pendenza ${s.freeGrade}%). Premi Fine per salvare.</div>`;
      if (heavy) drawWorkout($('#wkC'), s.workout.blocks, { progress: Math.min(s.elapsed, s.duration), power: s.samples.map(x => x.p), ftp: s.ftp / (s.intensity / 100) });
    } else if (kind === 'route') {
      const here = s.route.at(s.dist);
      const g = here.grade;
      $('#gNow').textContent = `${g.toFixed(1)}%`;
      $('#gNow').style.color = gradeColor(g);
      const ahead = s.route.gradeAhead(s.dist, 500);
      $('#gNext').innerHTML = `prossimi 500 m: ${ahead.toFixed(1)}%<br>mancano ${km(Math.max(0, s.route.length - s.dist))} km · quota ${Math.round(here.ele)} m<br>salita fatta ${Math.round(s.ascent)} m`;
      $('#mDs').textContent = `di ${km(s.route.length)} km`;
      if (heavy) {
        drawProfile($('#fullProf'), s.route, { pos: s.dist });
        drawProfile($('#nearProf'), s.route, { from: Math.max(0, s.dist - 200), to: Math.min(s.route.length, Math.max(s.dist - 200, 0) + 2200), pos: s.dist });
        if (map && marker) {
          const ll = [here.lat, here.lon];
          marker.setLatLng(ll);
          if (follow) map.panTo(ll, { animate: true, duration: 0.8 });
          const idx = Math.floor(s.dist / 10);
          if (idx - lastPathLen > 5) {
            const pts = []; for (let i = 0; i <= Math.min(idx, s.route.n - 1); i += Math.max(1, Math.floor(idx / 2000))) pts.push([s.route.lat[i], s.route.lon[i]]);
            pts.push(ll); done.setLatLngs(pts); lastPathLen = idx;
          }
        }
      }
    } else {
      const tgt = s.targetPower();
      $('#freeInfo').innerHTML = s.freeMode === 'erg'
        ? `<div><div class="muted small">WATT IMPOSTATI</div><div class="target">${tgt} W</div></div><div class="muted">Il rullo tiene questa potenza qualunque sia la cadenza. Usa + e − per cambiarla (5 W).<br>
           Partenza morbida: il rullo passa ai watt quando superi i 50 rpm. Con watt bassi usa un rapporto agile (pignone grande dietro): con il volano veloce il rullo non riesce a scendere sotto la sua resistenza minima.</div>`
        : `<div><div class="muted small">PENDENZA</div><div class="target" style="color:${gradeColor(s.freeGrade)}">${s.freeGrade.toFixed(1)}%</div></div><div class="muted">Strada virtuale: cambia la pendenza con + e − (0,5%). Usa i rapporti come su strada.</div>`;
      if (heavy) {
        const last = s.samples.slice(-1200);
        drawSeries($('#freeC'), [
          { data: last.map(x => x.p), color: '#ffa15c', max: Math.max(s.ftp * 1.6, ...last.map(x => x.p)), width: 2 },
          { data: last.map(x => x.hr), color: '#ef4444', max: 200 },
        ], { xmax: Math.max(600, last.length), grid: [{ value: s.ftp, color: 'rgba(255,255,255,.3)' }] });
      }
    }
  }
  s.on('tick', update);
  s.on('pause', update);
  update();
  setTimeout(() => { if (map) map.invalidateSize(); update(); }, 300);
}

async function endSession() {
  const s = S.session;
  if (!s) return;
  if (s.samples.length < 10) {
    if (!await confirmBox('Pedalata troppo breve per essere salvata. Terminare?', 'Termina', 'danger')) return;
    s.stop(); S.session = null; clearPending(); releaseWake(); go('home'); return;
  }
  if (!await confirmBox('Terminare la pedalata?', 'Termina')) return;
  const act = s.stop();
  S.session = null;
  releaseWake();
  savePending(act);
  if (S.trainer?.connected) S.trainer.setSim({ grade: 0 });
  showSummary(act);
}

function releaseWake() { try { S.wakeLock?.release(); } catch { /* */ } S.wakeLock = null; }

// ----------------------------------------------------------- riepilogo e salvataggio
async function showSummary(act, fromPending = false) {
  go('home', false);
  const sm = act.summary;
  const tiles = [
    ['Tempo', fmtDur(sm.duration)], ['Distanza', `${km(sm.distance)} km`], ['Velocità media', `${sm.avgSpeed} km/h`],
    ['Potenza media', `${n0(sm.avgP)} W`], ['Potenza normalizzata', `${n0(sm.np)} W`], ['Potenza max', `${n0(sm.maxP)} W`],
    ['Cardio medio', sm.avgHr ? `${sm.avgHr} bpm` : '–'], ['Cadenza media', sm.avgC ? `${sm.avgC} rpm` : '–'],
    ['Lavoro', `${sm.kj} kJ (~${sm.kcal} kcal)`], ['TSS', n0(sm.tss)], ['Dislivello', sm.ascent ? `${sm.ascent} m` : '–'],
  ];
  let ftpEst = null;
  if (act.rampTest && sm.best1m) ftpEst = Math.round(sm.best1m * 0.75);
  const r = await modal(`<h2>${esc(act.name)}</h2><p class="muted">${dateStr(act.start)} alle ${timeStr(act.start)}</p>
    <div class="stats">${tiles.map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
    ${ftpEst ? `<div class="banner">Test a rampa: miglior minuto ${sm.best1m} W → <b>FTP stimato ${ftpEst} W</b> (attuale ${S.profile.ftp} W)</div>` : ''}`,
  [{ label: 'Scarta', value: 'discard', cls: 'danger' }, ...(ftpEst ? [{ label: `Salva e imposta FTP ${ftpEst} W`, value: 'saveftp' }] : []), { label: 'Salva', value: 'save', cls: 'primary' }]);
  if (r === 'discard') {
    if (await confirmBox('La pedalata andrà persa. Sicuro?', 'Scarta', 'danger')) { clearPending(); renderHome(); }
    else showSummary(act, fromPending);
    return;
  }
  if (!r) return renderHome();
  try {
    const fit = buildFit(act);
    const saved = await api.saveActivity({ ...act, fit: toBase64(fit) });
    clearPending();
    if (r === 'saveftp') { S.profile = await api.saveProfile({ ...S.profile, ftp: ftpEst }); toast(`FTP aggiornato a ${ftpEst} W`); }
    renderHome();
    if (garminReady() && S.profile.garminAuto !== false) {
      // caricamento automatico subito dopo il salvataggio
      $('#modal').hidden = false;
      $('.modal-box').innerHTML = '<h2>Salvata ✅</h2><p>Caricamento su Garmin Connect in corso…</p>';
      let res;
      try { res = await api.garminUpload(saved.id); } catch (e) { res = { status: 'err', message: e.message }; }
      saved.garmin = res.garmin || saved.garmin;
      $('#modal').hidden = true;
      if (res.status === 'ok' || res.status === 'dup') {
        await modal(`<h2>Salvata ✅</h2><p>${res.status === 'ok' ? '<b>Caricata su Garmin Connect</b> (da lì passa anche a Strava).' : 'Garmin dice che questa attività <b>c\'è già</b>: nessun doppione creato.'}</p>`);
      } else {
        const r3 = await modal(`<h2>Salvata ✅</h2><p class="banner">Caricamento automatico su Garmin non riuscito:<br>${esc(res.message)}</p>
          <p class="muted small">Puoi riprovare ora o più tardi dallo Storico, oppure caricarla a mano.</p>`,
        [{ label: 'Più tardi', value: null }, { label: 'Carica a mano', value: 'manual' }, { label: 'Riprova', value: 'retry', cls: 'primary' }]);
        if (r3 === 'retry') await garminAutoUpload(saved);
        if (r3 === 'manual') await garminManual(saved);
      }
    } else {
      const r2 = await modal(`<h2>Salvata ✅</h2><p>Vuoi mandarla a Garmin Connect (e da lì a Strava)?</p>
        <p class="muted small">${garminReady() ? '"Carica su Garmin" la manda direttamente dal mini PC.' : '"Carica su Garmin" scarica il file .FIT e apre la pagina "Importa dati" di Garmin: premi "Sfoglia", nel menu ☰ scegli Download e seleziona il file.'} Puoi farlo anche più tardi dallo Storico.</p>`,
      [{ label: 'Più tardi', value: null }, { label: 'Solo scarica .FIT', value: 'fit' }, { label: 'Carica su Garmin', value: 'garmin', cls: 'primary' }]);
      if (r2 === 'fit') downloadFit(saved);
      if (r2 === 'garmin') await garminButton(saved);
    }
  } catch (e) {
    toast('Salvataggio non riuscito: ' + e.message + ' (la pedalata resta in memoria, riprova dalla Home)', 8000);
    renderHome();
  }
}

// ----------------------------------------------------------- Garmin Connect
const GARMIN_IMPORT = 'https://connect.garmin.com/modern/import-data';
const dtStr = ms => `${new Date(ms).toLocaleDateString('it-IT')} ${timeStr(ms)}`;
let garminAsk = null; // uscita per cui chiedere "sei riuscito a caricarla?" al ritorno nell'app

const garminReady = () => !!S.garmin?.configured;

function garminBadge(g) {
  if (g?.done) return `<span class="tag" style="color:#86efac">✅ su Garmin</span>`;
  const last = g?.log?.[g.log.length - 1];
  if (last?.action === 'auto-err') return `<span class="tag" style="color:#fca5a5" title="${esc(last.detail || '')}">⚠️ errore</span>`;
  if (g?.log?.some(l => l.action === 'attempt')) return `<span class="tag" style="color:#fde68a">⏳ tentato</span>`;
  return '';
}

const GARMIN_ACTIONS = {
  attempt: 'caricamento a mano: scaricato il file e aperto Garmin',
  done: 'confermato a mano: caricata su Garmin',
  undo: 'annullata la conferma',
  'auto-ok': 'caricata automaticamente dal mini PC',
  'auto-dup': 'caricamento automatico: Garmin dice che c\'era già',
  'auto-err': 'caricamento automatico NON riuscito',
};

function refreshGarminViews(a) {
  if (currentScreen !== 'history') return;
  if ($('#aBack')) showActivity(a.id); else renderHistory();
}

// pulsante principale: automatico se l'accesso a Garmin e' configurato, altrimenti a mano
function garminButton(a) { return garminReady() ? garminAutoUpload(a) : garminManual(a); }

async function garminAutoUpload(a) {
  let force = false;
  if (a.garmin?.done) {
    if (!await confirmBox(`<b>Attenzione:</b> questa uscita risulta <b>già caricata</b> su Garmin il ${dtStr(a.garmin.done)}.<br><br>Caricarla di nuovo? (se c'è già, Garmin di solito la rifiuta come doppione)`, 'Sì, di nuovo')) return;
    force = true;
  }
  toast('Caricamento su Garmin Connect…');
  let res;
  try { res = await api.garminUpload(a.id, force); } catch (e) { res = { status: 'err', message: e.message }; }
  if (res.garmin) a.garmin = res.garmin;
  if (res.status === 'ok') toast('✅ Caricata su Garmin Connect', 5000);
  else if (res.status === 'dup') toast('Garmin dice che c\'era già: nessun doppione', 6000);
  else {
    const r = await modal(`<h2>Garmin Connect</h2><p class="banner">Caricamento non riuscito:<br>${esc(res.message)}</p>`,
      [{ label: 'Chiudi', value: null }, { label: 'Carica a mano', value: 'manual', cls: 'primary' }]);
    if (r === 'manual') return garminManual(a);
  }
  refreshGarminViews(a);
}

async function downloadFit(a) {
  if (STANDALONE) {
    // versione portatile: il .FIT si crea qui dai dati salvati nel browser
    const full = a.samples ? a : await api.activity(a.id);
    const name = `${a.id.slice(0, 15)}_${(a.name || 'uscita').replace(/[^A-Za-z0-9_-]+/g, '_').slice(0, 40)}.fit`;
    download(name, buildFit(full), 'application/vnd.ant.fit');
    return;
  }
  const link = document.createElement('a');
  link.href = `/api/activities/${a.id}.fit`;
  link.download = '';
  document.body.appendChild(link); link.click(); link.remove();
}

// Scarica il .FIT e apre la pagina di importazione di Garmin in un'altra scheda
async function garminManual(a) {
  const g = a.garmin;
  const attempts = (g?.log || []).filter(l => l.action === 'attempt');
  if (g?.done || attempts.length) {
    const msg = g?.done
      ? `<b>Attenzione:</b> questa uscita risulta <b>già caricata</b> su Garmin il ${dtStr(g.done)}. Caricarla di nuovo creerebbe un doppione.`
      : `Hai già provato a caricarla ${attempts.length === 1 ? 'una volta' : attempts.length + ' volte'}, l'ultima il ${dtStr(attempts[attempts.length - 1].ts)}. Controlla su Garmin Connect che non ci sia già.`;
    if (!await confirmBox(msg + '<br><br>Vuoi scaricarla e aprire Garmin di nuovo?', 'Sì, di nuovo')) return;
  }
  await downloadFit(a);
  window.open(GARMIN_IMPORT, '_blank', 'noopener');
  if (!STANDALONE) { // il registro c'e' solo nella versione di casa
    try { a.garmin = await api.garminLog(a.id, 'attempt'); } catch (e) { toast(e.message); }
    garminAsk = a;
  }
  toast('File scaricato: su Garmin premi "Sfoglia", nel menu ☰ scegli "Download" e seleziona il file', 8000);
}

async function askGarminResult() {
  const a = garminAsk;
  if (!a || document.visibilityState !== 'visible' || S.session) return;
  garminAsk = null;
  const r = await modal(`<h2>Garmin Connect</h2><p>Sei riuscito a caricare <b>${esc(a.name)}</b> del ${dateStr(a.start)}?</p>`,
    [{ label: 'Non ancora', value: false }, { label: 'Sì, caricata', value: true, cls: 'primary' }]);
  if (r) {
    try { a.garmin = await api.garminLog(a.id, 'done'); toast('Segnata come caricata su Garmin'); } catch (e) { toast(e.message); }
  }
  refreshGarminViews(a);
}
document.addEventListener('visibilitychange', () => { if (garminAsk) setTimeout(askGarminResult, 600); });

const PENDING = 'rullo.pending';
function savePending(act) { try { localStorage.setItem(PENDING, JSON.stringify(act)); } catch { /* spazio pieno */ } }
function loadPending() { try { const a = JSON.parse(localStorage.getItem(PENDING)); return a && a.samples?.length >= 10 ? a : null; } catch { return null; } }
function clearPending() { localStorage.removeItem(PENDING); }

// ====================================================================== STORICO
async function renderHistory() {
  main.innerHTML = '<p class="muted">Caricamento…</p>';
  let acts;
  try { acts = await api.activities(); } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; return; }
  acts.sort((a, b) => b.start - a.start);
  const sum = (arr, f) => arr.reduce((s, a) => s + (f(a) || 0), 0);
  const now = new Date();
  const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)).getTime();
  const periods = [
    ['Questa settimana', acts.filter(a => a.start >= startOfWeek)],
    ['Questo mese', acts.filter(a => a.start >= new Date(now.getFullYear(), now.getMonth(), 1).getTime())],
    ['Quest\'anno', acts.filter(a => a.start >= new Date(now.getFullYear(), 0, 1).getTime())],
  ];
  // ultime 12 settimane
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const ws = startOfWeek - i * 7 * 86400e3, we = ws + 7 * 86400e3;
    const wa = acts.filter(a => a.start >= ws && a.start < we);
    weeks.push({ label: new Date(ws).toLocaleDateString('it-IT', { day: 'numeric', month: 'numeric' }), value: Math.round(sum(wa, a => a.summary?.duration) / 60) });
  }
  main.innerHTML = `
    <h2>Storico</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:12px">${periods.map(([t, arr]) => `
      <div class="card"><h3>${t}</h3><div class="stats">
        <div><b>${arr.length}</b><span>uscite</span></div><div><b>${fmtDur(sum(arr, a => a.summary?.duration))}</b><span>tempo</span></div>
        <div><b>${km(sum(arr, a => a.summary?.distance))}</b><span>km</span></div><div><b>${Math.round(sum(arr, a => a.summary?.tss))}</b><span>TSS</span></div>
        <div><b>${Math.round(sum(arr, a => a.summary?.ascent))}</b><span>m salita</span></div></div></div>`).join('')}</div>
    <div class="card" style="margin-bottom:12px"><h3>Minuti per settimana</h3><canvas class="chart" id="hWeeks" style="height:140px"></canvas></div>
    ${acts.length ? `<div class="card" style="overflow-x:auto"><table>
      <tr><th>Data</th><th>Uscita</th><th class="n">Tempo</th><th class="n">km</th><th class="n">W medi</th><th class="n">NP</th><th class="n">FC</th><th class="n">TSS</th><th>Garmin</th></tr>
      ${acts.map(a => `<tr data-id="${a.id}" style="cursor:pointer"><td>${dateStr(a.start)}</td><td>${esc(a.name)}</td>
        <td class="n">${fmtDur(a.summary?.duration || 0)}</td><td class="n">${km(a.summary?.distance || 0)}</td><td class="n">${n0(a.summary?.avgP)}</td>
        <td class="n">${n0(a.summary?.np)}</td><td class="n">${n0(a.summary?.avgHr)}</td><td class="n">${n0(a.summary?.tss)}</td>
        <td>${a.garmin?.done ? garminBadge(a.garmin) : `${garminBadge(a.garmin)} <button class="btn" data-garmin="${a.id}" style="min-height:36px;padding:6px 12px">Carica</button>`}</td></tr>`).join('')}
    </table></div>` : '<div class="card"><p class="muted">Nessuna uscita salvata.</p></div>'}`;
  drawBars($('#hWeeks'), weeks, { fmt: v => v });
  $$('tr[data-id]').forEach(tr => tr.onclick = () => showActivity(tr.dataset.id));
  $$('[data-garmin]').forEach(b => b.onclick = e => { e.stopPropagation(); garminButton(acts.find(a => a.id === b.dataset.garmin)); });
}

async function showActivity(id) {
  const a = await api.activity(id);
  const sm = a.summary;
  main.innerHTML = `
    <div class="row" style="margin-bottom:12px"><button class="btn" id="aBack">← Storico</button><h2 style="margin:0">${esc(a.name)}</h2>
      <div class="spacer"></div>${garminBadge(a.garmin)}<button class="btn primary" id="aGarmin">Carica su Garmin</button>
      ${garminReady() ? '<button class="btn" id="aManual">Carica a mano</button>' : ''}
      <button class="btn" id="aFit">Solo scarica .FIT</button>
      <button class="btn danger" id="aDel">Elimina</button></div>
    ${a.garmin?.log?.length ? `<div class="card" style="margin-bottom:12px"><h3>Registro Garmin</h3><ul class="small" style="margin:0;padding-left:18px">
      ${a.garmin.log.map(l => `<li>${dtStr(l.ts)} – ${GARMIN_ACTIONS[l.action] || esc(l.action)}${l.detail && l.action === 'auto-err' ? `: <span class="muted">${esc(l.detail)}</span>` : ''}</li>`).join('')}</ul>
      ${a.garmin.done ? '<button class="btn" id="aUndo" style="margin-top:8px">Non era caricata davvero</button>' : '<button class="btn" id="aDone" style="margin-top:8px">Segna come caricata</button>'}</div>` : ''}
    <p class="muted">${dateStr(a.start)} alle ${timeStr(a.start)} · FTP ${sm.ftp} W · peso ${sm.weight} kg</p>
    <div class="card"><div class="stats">
      <div><b>${fmtDur(sm.duration)}</b><span>tempo</span></div><div><b>${km(sm.distance)} km</b><span>distanza</span></div><div><b>${sm.avgSpeed} km/h</b><span>media</span></div>
      <div><b>${n0(sm.avgP)} W</b><span>potenza media</span></div><div><b>${n0(sm.np)} W</b><span>normalizzata</span></div><div><b>${n0(sm.maxP)} W</b><span>max</span></div>
      <div><b>${sm.avgHr ?? '–'}</b><span>FC media</span></div><div><b>${sm.maxHr ?? '–'}</b><span>FC max</span></div><div><b>${sm.avgC ?? '–'}</b><span>cadenza</span></div>
      <div><b>${sm.kj} kJ</b><span>lavoro</span></div><div><b>${n0(sm.tss)}</b><span>TSS</span></div><div><b>${sm.if?.toFixed(2) ?? '–'}</b><span>IF</span></div>
      <div><b>${sm.ascent || 0} m</b><span>salita</span></div><div><b>${sm.best1m ?? '–'} / ${sm.best5m ?? '–'} / ${sm.best20m ?? '–'}</b><span>miglior 1′ / 5′ / 20′ (W)</span></div>
    </div>
    <h3>Potenza (arancio) e cardio (rosso)</h3><canvas class="chart" id="aChart" style="height:220px"></canvas>
    ${a.samples.some(x => x.ele != null) ? '<h3 style="margin-top:12px">Altimetria</h3><canvas class="chart" id="aEle" style="height:110px"></canvas><div class="map" id="aMap" style="margin-top:12px"></div>' : ''}
    </div>`;
  $('#aBack').onclick = renderHistory;
  $('#aGarmin').onclick = () => garminButton(a);
  if ($('#aManual')) $('#aManual').onclick = () => garminManual(a);
  $('#aFit').onclick = () => downloadFit(a);
  if ($('#aDone')) $('#aDone').onclick = async () => { await api.garminLog(a.id, 'done'); showActivity(a.id); };
  if ($('#aUndo')) $('#aUndo').onclick = async () => { await api.garminLog(a.id, 'undo'); showActivity(a.id); };
  $('#aDel').onclick = async () => {
    if (!await confirmBox(STANDALONE ? 'Eliminare definitivamente questa uscita?' : 'Eliminare questa uscita? (finisce nel cestino sul server)', 'Elimina', 'danger')) return;
    await api.deleteActivity(a.id); renderHistory();
  };
  drawSeries($('#aChart'), [
    { data: a.samples.map(x => x.p), color: '#ffa15c', max: Math.max(...a.samples.map(x => x.p)) * 1.1 },
    { data: a.samples.map(x => x.hr), color: '#ef4444', max: 200 },
  ], { grid: [{ value: sm.ftp }] });
  if ($('#aEle')) {
    drawSeries($('#aEle'), [{ data: a.samples.map(x => x.ele), fill: 'rgba(255,122,26,.45)', max: Math.max(...a.samples.map(x => x.ele ?? 0)) + 20 }]);
    if (window.L) {
      const map = L.map($('#aMap'));
      addTiles(map);
      const line = L.polyline(a.samples.filter(x => x.lat != null).map(x => [x.lat, x.lon]), { color: '#ff7a1a', weight: 4 }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [20, 20] });
      window._mapCleanup = () => map.remove();
    }
  }
}

// ====================================================================== PROFILO
function renderProfile() {
  const p = structuredClone(S.profile);
  main.innerHTML = `
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">Profilo</h2><div class="spacer"></div><button class="btn primary" id="pSave">Salva</button></div>
    ${STANDALONE && !S.profile.setupDone ? `<div class="banner"><b>Benvenuto!</b> Inserisci il tuo peso, quello della bici e il tuo FTP
      (se non lo conosci lascia il valore proposto e poi fai il "Test FTP a rampa" negli Allenamenti), poi premi <b>Salva</b>.</div>` : ''}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card"><h3>Tu e la bici</h3><div class="form-grid">
        <label class="f">Peso (kg)<input type="number" step="0.1" inputmode="decimal" id="fWeight" value="${p.weight}"></label>
        <label class="f">Peso bici (kg)<input type="number" step="0.1" inputmode="decimal" id="fBike" value="${p.bikeWeight}"></label>
        <label class="f">FTP (W)<input type="number" inputmode="numeric" id="fFtp" value="${p.ftp}"></label>
        <label class="f">FC massima (facoltativa)<input type="number" inputmode="numeric" id="fHrMax" value="${p.hrMax ?? ''}"></label>
      </div><p class="muted small" id="fWkg"></p></div>
      <div class="card"><h3>Realismo della strada virtuale</h3><div class="form-grid">
        <label class="f">Posizione in sella<select id="fPos">${Object.entries(POSITIONS).map(([k, v]) => `<option value="${k}" ${k === p.position ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
        <label class="f">CdA (m²)<input type="number" step="0.01" id="fCda"></label>
        <label class="f">Fondo stradale<select id="fSurf">${Object.entries(SURFACES).map(([k, v]) => `<option value="${k}" ${k === p.surface ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
        <label class="f">Crr<input type="number" step="0.001" id="fCrr"></label>
        <label class="f">Difficoltà percorsi (%)<input type="number" step="10" min="0" max="150" id="fDiff" value="${p.difficulty}"></label>
      </div><p class="muted small" id="fSpeeds"></p></div>
      <div class="card"><h3>Rullo</h3><div class="form-grid">
        <label class="f">Protocollo<select id="fProto">
          <option value="auto" ${p.protocol === 'auto' ? 'selected' : ''}>Automatico (Wahoo se c'è)</option>
          <option value="wahoo" ${p.protocol === 'wahoo' ? 'selected' : ''}>Wahoo (manda anche il peso)</option>
          <option value="ftms" ${p.protocol === 'ftms' ? 'selected' : ''}>FTMS standard</option></select></label>
        <label class="f">Pausa automatica<select id="fAuto"><option value="1" ${p.autoPause !== false ? 'selected' : ''}>Sì</option><option value="0" ${p.autoPause === false ? 'selected' : ''}>No</option></select></label>
      </div><p class="muted small">Il protocollo si applica alla prossima connessione del rullo.</p></div>
      ${STANDALONE ? `<div class="card"><h3>Garmin Connect</h3>
        <p>Dopo ogni uscita: <b>Carica su Garmin</b> scarica il file .FIT e apre la pagina "Importa dati" di Garmin Connect.
        Lì premi "Sfoglia", nel menu ☰ scegli "Download" e seleziona il file.</p></div>
      <div class="card"><h3>I tuoi dati</h3>
        <p class="small">In questa versione profilo, allenamenti, percorsi e uscite sono salvati <b>solo in questo browser</b>.
        Se cancelli i dati di Chrome o cambi tablet li perdi: ogni tanto fai una copia.</p>
        <div class="row"><button class="btn" id="bExport">Scarica copia dei dati</button><button class="btn" id="bImport">Ripristina da copia</button></div></div>`
      : `<div class="card"><h3>Garmin Connect</h3>
        <p>${garminReady() ? `✅ Collegato${S.garmin.account ? ' come <b>' + esc(S.garmin.account) + '</b>' : ''}: il mini PC carica le uscite direttamente.`
          : '⚠️ Caricamento automatico non configurato: per ora si carica a mano.'}</p>
        <label class="f">Dopo il salvataggio<select id="fGarminAuto">
          <option value="1" ${p.garminAuto !== false ? 'selected' : ''}>Carica subito su Garmin</option>
          <option value="0" ${p.garminAuto === false ? 'selected' : ''}>Chiedimi cosa fare</option></select></label>
        <p class="muted small">${garminReady() ? 'Se l\'app segnala che l\'accesso è scaduto (circa una volta l\'anno), va rifatto il login sul mini PC.'
          : 'Per attivarlo serve un accesso una tantum a Garmin dal mini PC (comando <code>~/rullo/garmin_login.sh</code>).'}</p></div>`}
      <div class="card"><h3>Zone di potenza</h3><table id="fZones"></table></div>
      <div class="card"><h3>Storico dei tuoi dati</h3><canvas class="chart" id="fHistC" style="height:140px"></canvas>
        <table id="fHist" class="small"></table></div>
    </div>`;
  const cdaIn = $('#fCda'), crrIn = $('#fCrr');
  const read = () => {
    p.weight = +$('#fWeight').value || p.weight; p.bikeWeight = +$('#fBike').value || 0; p.ftp = +$('#fFtp').value || p.ftp;
    p.hrMax = +$('#fHrMax').value || null; p.position = $('#fPos').value; p.surface = $('#fSurf').value;
    p.difficulty = +$('#fDiff').value; p.protocol = $('#fProto').value; p.autoPause = $('#fAuto').value === '1';
    if ($('#fGarminAuto')) p.garminAuto = $('#fGarminAuto').value === '1';
    if (p.position === 'custom') p.cdaCustom = +cdaIn.value || p.cdaCustom || 0.45;
    if (p.surface === 'custom') p.crrCustom = +crrIn.value || p.crrCustom || 0.005;
  };
  const refresh = () => {
    read();
    cdaIn.value = profileCda(p); cdaIn.disabled = p.position !== 'custom';
    crrIn.value = profileCrr(p); crrIn.disabled = p.surface !== 'custom';
    $('#fWkg').textContent = `${(p.ftp / p.weight).toFixed(2)} W/kg · massa totale ${(p.weight + p.bikeWeight).toFixed(1)} kg`;
    const prm = { mass: p.weight + p.bikeWeight, cda: profileCda(p), crr: profileCrr(p) };
    const sp = (w, g) => (steadySpeed(w, g, prm) * 3.6).toFixed(1);
    $('#fSpeeds').innerHTML = `Con questi valori, a ${p.ftp} W: <b>${sp(p.ftp, 0)} km/h</b> in pianura, <b>${sp(p.ftp, 4)} km/h</b> al 4%, <b>${sp(p.ftp, 8)} km/h</b> all'8%.`;
    $('#fZones').innerHTML = '<tr><th>Zona</th><th class="n">Watt</th></tr>' + ZONES.map((z, i) => {
      const lo = i ? Math.round(ZONES[i - 1].max * p.ftp / 100) + 1 : 0;
      return `<tr><td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${z.color};margin-right:6px"></span>${z.name}</td>
        <td class="n">${i === ZONES.length - 1 ? `oltre ${lo - 1}` : `${lo}–${Math.round(z.max * p.ftp / 100)}`}</td></tr>`;
    }).join('');
  };
  $$('input, select', main).forEach(el => el.addEventListener('change', refresh));
  refresh();
  const hist = S.profile.history || [];
  $('#fHist').innerHTML = '<tr><th>Data</th><th class="n">Peso</th><th class="n">FTP</th><th class="n">W/kg</th></tr>' +
    [...hist].reverse().map(h => `<tr><td>${new Date(h.date).toLocaleDateString('it-IT')}</td><td class="n">${h.weight}</td><td class="n">${h.ftp}</td><td class="n">${(h.ftp / h.weight).toFixed(2)}</td></tr>`).join('');
  if (hist.length > 1) drawSeries($('#fHistC'), [
    { data: hist.map(h => h.weight), color: '#3b82f6', max: Math.max(...hist.map(h => h.weight)) * 1.2, width: 2 },
    { data: hist.map(h => h.ftp), color: '#ffa15c', max: Math.max(...hist.map(h => h.ftp)) * 1.2, width: 2 }]);
  else $('#fHistC').replaceWith(Object.assign(document.createElement('p'), { className: 'muted small', textContent: 'Quando cambi peso o FTP, qui vedrai l\'andamento (blu peso, arancio FTP).' }));
  $('#pSave').onclick = async () => {
    read();
    try { S.profile = await api.saveProfile(p); toast('Profilo salvato'); renderProfile(); }
    catch (e) { toast(e.message, 5000); }
  };
  if ($('#bExport')) $('#bExport').onclick = async () => {
    const data = await api.exportAll();
    const d = new Date();
    download(`rullo-copia-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`,
      JSON.stringify(data), 'application/json');
    toast(`Copia scaricata (${data.activities.length} uscite, ${data.routes.length} percorsi, ${data.workouts.length} allenamenti)`, 5000);
  };
  if ($('#bImport')) $('#bImport').onclick = async () => {
    const [f] = await pickFile('.json,application/json');
    if (!f) return;
    if (!await confirmBox('Ripristinare i dati dalla copia? Profilo e elementi con lo stesso nome verranno sostituiti, gli altri restano.', 'Ripristina')) return;
    try {
      const n = await api.importAll(JSON.parse(await f.text()));
      S.profile = await api.profile();
      [S.workouts, S.routes] = await Promise.all([api.workouts(), api.routes()]);
      toast(`Ripristinati ${n} elementi`); renderProfile();
    } catch (e) { toast(e.message, 6000); }
  };
}

// ====================================================================== avvio
async function init() {
  $('#btnHome').onclick = () => go('home');
  $$('#nav button').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#chipTrainer').onclick = () => deviceDialog('trainer');
  $('#chipHr').onclick = () => deviceDialog('hr');
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', e => { if (S.session) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('resize', () => { if (currentScreen === 'ride' && S.session) S.session.emit('tick', S.session); });
  try {
    S.profile = await api.profile();
    [S.workouts, S.routes] = await Promise.all([api.workouts(), api.routes()]);
    S.garmin = await api.garminStatus().catch(() => null);
  } catch (e) {
    main.innerHTML = `<div class="card"><h2>${STANDALONE ? 'Errore nel leggere i dati' : 'Server non raggiungibile'}</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Riprova</button></div>`;
    return;
  }
  if (STANDALONE) {
    document.title = 'Rullo portatile';
    // chiede al browser di non cancellare i dati per fare spazio
    try { navigator.storage?.persist?.(); } catch { /* non disponibile */ }
    if (!S.profile.setupDone) history.replaceState(null, '', '#profile');
  }
  updateChips();
  route();
  const useSw = !STANDALONE || window.RULLO_CONFIG.sw; // il file aperto da disco non puo' usarlo
  if (useSw && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();

return {  };
})();
</script>
